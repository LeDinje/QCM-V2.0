<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pôle Sud QCM</title>
  <meta name="description" content="Plateforme d'évaluation des candidats Pôle Sud.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script>try{var t=localStorage.getItem('qcm.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
  <script type="module">import { initPage } from "./js/ui.js"; initPage();</script>
</head>
<body class="landing-page">
  <!-- Fond typographique : mur des valeurs en lettres ajourées (rempli par script) -->
  <div class="value-cloud" aria-hidden="true"><div class="wall" id="valueWall"></div></div>

  <main class="landing">
    <div class="hublot">
      <div>
        <img class="logo-main" src="assets/logo-polesud.png" alt="Pôle Sud">
        <h1 style="margin-top:18px">Plateforme d'évaluation</h1>
        <p class="lead">Questionnaires techniques pour nos futurs collaborateurs.</p>
      </div>

      <nav class="portal-cards" aria-label="Choisir un espace">
        <a class="portal-card" href="candidate.html">
          <span class="pc-icon"><i data-icon="clipboard" class="icon-lg"></i></span>
          <span>
            <span class="pc-title" style="display:block">Espace candidat</span>
            <span class="pc-sub" style="display:block">Passer un questionnaire</span>
          </span>
          <i data-icon="chevron-right" class="pc-arrow"></i>
        </a>
        <a class="portal-card" href="admin.html">
          <span class="pc-icon"><i data-icon="dashboard" class="icon-lg"></i></span>
          <span>
            <span class="pc-title" style="display:block">Espace administrateur</span>
            <span class="pc-sub" style="display:block">Gérer les QCM et les résultats</span>
          </span>
          <i data-icon="chevron-right" class="pc-arrow"></i>
        </a>
      </nav>

      <div class="landing-foot">
        <a class="btn btn-ghost btn-sm" href="patchnote.html"><i data-icon="file" class="icon-sm"></i> Notes de version</a>
        <button class="btn btn-ghost btn-sm btn-icon" type="button" data-theme-toggle></button>
      </div>
    </div>
  </main>

  <script>
    // Remplit le fond avec un « mur » des valeurs, répété et mélangé, pour couvrir toute la page
    (function(){
      var words = ["Innovation","Proximité","Expertise","Confiance","Réactivité","Engagement",
        "Qualité","Écoute","Sécurité","Performance","Accompagnement","Disponibilité","Rigueur",
        "Passion","Sur-mesure","Infogérance","Bienveillance","Agilité","Transparence","ESN","Supervision",
        "RSE","ISO 9001","ISO 14001"];
      function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
      var el = document.getElementById('valueWall');
      if(!el) return;
      var SEP = "   •   ";
      var block = "";
      for(var i=0;i<60;i++){ block += shuffle(words).join(SEP) + SEP; }
      el.textContent = block;
    })();
  </script>
</body>
</html>
